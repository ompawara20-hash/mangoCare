version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mangocare-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - FRONTEND_URL=http://localhost
      - DATABASE_URL=sqlite:////app/data/mangocare.db
      - REPORT_DIRECTORY=/app/reports
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mangocare-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
